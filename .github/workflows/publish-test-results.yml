name: Publish Test Results

on:
  workflow_run:
    workflows: [ 'Run Checks via Gradle' ]
    types: [ completed ]

permissions:
  actions: read
  contents: read
  checks: write

jobs:
  checks:
    runs-on: ubuntu-24.04
    steps:
      - name: Download Test Report
        uses: dawidd6/action-download-artifact@a92c7ae74cf1df8810783758581e485ac3aaa309 # v28
        with:
          name: junit-test-results.*
          name_is_regexp: true
          run_id: ${{ github.event.workflow_run.id }}

      - name: Publish Test Report
        uses: mikepenz/action-junit-report@a16be3a69023e9bd7e748ede768b3282ea7b30ce # v6.7.1
        with:
          commit: ${{github.event.workflow_run.head_sha}}
          # The Gradle artifacts keep the build/test-results/test/ path of each module, the Maven one has its reports at its root.
          report_paths: '**/TEST-*.xml'
          detailed_summary: true
