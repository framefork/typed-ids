name: Dependency Submission

on:
  push:
    branches: [ 'master' ]

permissions:
  contents: write

env:
  GRADLE_OPTS: "-Dorg.gradle.console=plain -Dorg.gradle.daemon=false -Dorg.gradle.stacktrace=always"

jobs:
  dependency-submission:
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v7

    - uses: actions/setup-java@v6
      with:
        distribution: temurin
        java-version: 25

    - name: Generate and submit dependency graph
      id: dependency-submission
      uses: gradle/actions/dependency-submission@v6
      with:
        # basic: the MIT-licensed caching on the GitHub Actions cache; the default 'enhanced' loads a proprietary component under Gradle's Terms of Use
        cache-provider: basic
        dependency-graph-exclude-projects: '^:(.*-testing|testing-.*)'
        dependency-graph-exclude-configurations: '.*[Tt]est(Compile|Runtime)Classpath'

    - name: Also upload the raw dependency graph as an artifact
      uses: actions/upload-artifact@v7
      with:
        name: gradle-dependency-graph-file
        path: ${{ steps.dependency-submission.outputs.dependency-graph-file }}
        retention-days: 1
