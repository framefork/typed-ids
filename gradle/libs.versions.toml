[versions]
errorProne = "2.35.1"
junit-jupiter = "5.10.3"
jackson = "2.18.1"
testcontainers = "1.21.4"
hibernateOrmTesting = "0.1.0"
hibernateOrmTypes = "0.1.0"
springBoot = "3.5.8"
springBoot401 = "4.0.1"

[libraries]
uuidGenerator = { module = "com.fasterxml.uuid:java-uuid-generator", version = "5.1.1" }
jetbrains-annotations = { module = "org.jetbrains:annotations", version = "26.0.2" }
jackson-databind = { group = "com.fasterxml.jackson.core", name = "jackson-databind", version.ref = "jackson" }
jackson-databind-v2141 = { group = "com.fasterxml.jackson.core", name = "jackson-databind", version = "2.14.1" }
jackson-annotations = { group = "com.fasterxml.jackson.core", name = "jackson-annotations", version.ref = "jackson" }
jackson3-databind = { group = "tools.jackson.core", name = "jackson-databind", version = "3.0.2" }
gson = { module = "com.google.code.gson:gson", version = "2.10.1" }
gson-v2150 = { module = "com.google.code.gson:gson", version = "2.15.0" }
errorprone-annotations = { group = "com.google.errorprone", name = "error_prone_annotations", version.ref = "errorProne" }
lombok = { module = "org.projectlombok:lombok", version = "1.18.46" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter", version.ref = "junit-jupiter" }
assertj-core = { module = "org.assertj:assertj-core", version = "3.27.4" }
testcontainers-bom = { module = "org.testcontainers:testcontainers-bom", version.ref = "testcontainers" }
testcontainers-base = { module = "org.testcontainers:testcontainers" }
testcontainers-postgresql = { module = "org.testcontainers:postgresql" }
testcontainers-mysql = { module = "org.testcontainers:mysql" }
testcontainers-junit-jupiter = { module = "org.testcontainers:junit-jupiter" }
datasource-hikaricp = { module = "com.zaxxer:HikariCP", version = "5.1.0" }
postgresql = { module = "org.postgresql:postgresql", version = "42.7.8" }
mysql = { module = "com.mysql:mysql-connector-j", version = "9.4.0" }
logback-classic = { module = "ch.qos.logback:logback-classic", version = "1.5.12" }
slf4j-api = { module = "org.slf4j:slf4j-api", version = "1.7.36" }
hibernate-orm-v72 = { group = "org.hibernate.orm", name = "hibernate-core", version = "7.2.0.Final" }
hibernate-orm-v73 = { group = "org.hibernate.orm", name = "hibernate-core", version = "7.3.13.Final" }
hibernate-orm-v74 = { group = "org.hibernate.orm", name = "hibernate-core", version = "7.4.15.Final" }
hibernate-orm-v80 = { group = "org.hibernate.orm", name = "hibernate-core", version = "8.0.0.CR1" }
hibernate-models-v70 = { group = "org.hibernate.models", name = "hibernate-models", version = "1.0.0" }
hibernate-models-v80 = { group = "org.hibernate.models", name = "hibernate-models", version = "1.3.4" }
hibernate-orm-testing-v72 = { group = "org.framefork.testing", name = "hibernate-orm-testing-72", version.ref = "hibernateOrmTesting" }
hibernate-orm-testing-v80 = { group = "org.framefork.testing", name = "hibernate-orm-testing-80", version.ref = "hibernateOrmTesting" }
hibernate-orm-types-v72 = { group = "org.framefork", name = "hibernate-orm-types-72", version.ref = "hibernateOrmTypes" }
hibernate-orm-types-v80 = { group = "org.framefork", name = "hibernate-orm-types-80", version.ref = "hibernateOrmTypes" }
hypersistence-tsid = { module = "io.hypersistence:hypersistence-tsid", version = "2.1.4" }
kotlinx-serialization = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version = "1.7.0" }
swagger-v3-core-jakarta = { module = "io.swagger.core.v3:swagger-core-jakarta", version = "2.2.35" }
swagger-v3-core = { module = "io.swagger.core.v3:swagger-core", version = "3.0.0" }
springdoc-openapi-starter-common-v300 = { module = "org.springdoc:springdoc-openapi-starter-common", version = "3.0.0" }
spring-core-v702 = { group = "org.springframework", name = "spring-core", version = "7.0.2" }
spring-boot-v401 = { group = "org.springframework.boot", name = "spring-boot", version.ref = "springBoot401" }
spring-boot-autoconfigure-v401 = { group = "org.springframework.boot", name = "spring-boot-autoconfigure", version.ref = "springBoot401" }
spring-boot-test-v401 = { group = "org.springframework.boot", name = "spring-boot-test", version.ref = "springBoot401" }
spring-boot-configuration-processor = { group = "org.springframework.boot", name = "spring-boot-configuration-processor", version.ref = "springBoot401" }

# Floors the Spring Boot starters pin, so a build without the Boot BOM still resolves at least these versions. Each floor is the higher of
# what the first release of the starter's Boot minor manages (docs/spring-boot-compat-matrix.md §5) and what the typed-ids modules the starter
# pulls declare for that library: a lower pin would be an untested version that Maven's nearest-wins hands to users without the Boot BOM.
starter-floor-boot40-hibernate = { group = "org.hibernate.orm", name = "hibernate-core", version = "7.2.0.Final" } # Boot 4.0.1 and typed-ids-hibernate-72 agree
starter-floor-boot40-jackson = { group = "tools.jackson.core", name = "jackson-databind", version = "3.0.3" }
starter-floor-boot40-spring = { group = "org.springframework", name = "spring-core", version = "7.0.2" }
starter-floor-boot41-hibernate = { group = "org.hibernate.orm", name = "hibernate-core", version = "7.4.1.Final" }
starter-floor-boot41-jackson = { group = "tools.jackson.core", name = "jackson-databind", version = "3.1.4" }
starter-floor-boot41-spring = { group = "org.springframework", name = "spring-core", version = "7.0.8" }
starter-floor-boot42-hibernate = { group = "org.hibernate.orm", name = "hibernate-core", version = "7.4.5.Final" }
starter-floor-boot42-jackson = { group = "tools.jackson.core", name = "jackson-databind", version = "3.1.5" }
starter-floor-boot42-spring = { group = "org.springframework", name = "spring-core", version = "7.1.0-M1" }
